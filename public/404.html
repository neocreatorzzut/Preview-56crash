<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Crash Training</title>
    <script>
      // GitHub Pages SPA redirect: encode the current path and redirect to root
      // so React Router can handle the route client-side.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1).join('/') + '/?/' +
        l.pathname.slice(1).replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
